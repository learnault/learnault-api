# CI: lint, format check, type check, and tests on PR and push to main
# Branch protection: enable "Require status checks to pass" for this workflow in repo Settings > Branches

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, typecheck, format, test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: learnault
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/learnault"

      - name: Push database schema
        run: npx prisma db push --accept-data-loss
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/learnault"

      - name: Lint (ESLint)
        run: pnpm run lint

      - name: Run tests with coverage
        run: pnpm run test:coverage
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/learnault"

      - name: Upload coverage (optional)
        uses: actions/upload-artifact@v4
        if: success() && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
